server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API is reached through the same origin as the application, so the
  # browser never performs a cross-origin request and CORS stays irrelevant in
  # this deployment shape.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://api:3000/docs;
    proxy_set_header Host $host;
  }

  # Hashed assets are immutable; the entry HTML must never be cached or users
  # keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
