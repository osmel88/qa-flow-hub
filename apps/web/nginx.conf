server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Do not advertise the nginx version in headers and error pages.
  server_tokens off;

  # Evidence uploads go through this proxy. nginx defaults to 1 MiB, which
  # would answer 413 long before the API's UPLOAD_MAX_SIZE_BYTES (10 MiB) does.
  client_max_body_size 11m;

  # The API is reached through the same origin as the application, so the
  # browser never performs a cross-origin request and CORS stays irrelevant in
  # this deployment shape.
  #
  # This nginx is the one proxy hop the API trusts (TRUST_PROXY=1): it appends
  # the address it saw to X-Forwarded-For and the API reads exactly that entry,
  # for the rate limiter and for the audit log. Anything the client wrote
  # earlier in the header is ignored.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Host $host;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /docs {
    proxy_pass http://api:3000/docs;
    proxy_set_header Host $host;
  }

  # Hashed assets are immutable; the entry HTML must never be cached or users
  # keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
