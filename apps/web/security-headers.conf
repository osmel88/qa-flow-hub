# Security headers for every response the web container serves.
#
# Included from each `location` rather than set once on the server: nginx drops
# inherited `add_header` directives as soon as a location adds its own (the
# Cache-Control lines below), which is how headers silently disappear.
#
# The policy matches the bundle Vite produces: module scripts and stylesheets
# from this origin only, no inline script, API calls to this same origin
# (nginx forwards /api), evidence previews as blob: images and frames (PDF, text). Keep it in
# sync with `securityHeaders` in vite.config.ts, which the end-to-end suite
# runs under.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs to whoever terminates TLS. Uncomment when this nginx does:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
