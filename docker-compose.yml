# ---------------------------------------------------------------------------
# Local stack: PostgreSQL (development), PostgreSQL (test), API and web client.
#
# The test database is a separate service on port 5433 so that running the
# integration suite never truncates the data you are working with.
#
# There is deliberately no Redis: sessions and refresh tokens live in
# PostgreSQL, and rate limiting is in-process. See docs/technical-debt.md.
# ---------------------------------------------------------------------------
name: qa-flow-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaflow}
      POSTGRES_DB: ${POSTGRES_DB:-qa_flow_hub}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qaflow} -d ${POSTGRES_DB:-qa_flow_hub}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaflow}
      POSTGRES_DB: qa_flow_hub_test
    ports:
      - '5433:5432'
    # No named volume: a test database is disposable by definition, and keeping
    # it in tmpfs makes truncation between suites noticeably faster.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qaflow} -d qa_flow_hub_test']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # The non-owning role, so the Row Level Security policies apply. Run the
      # migrations and `npm run db:grant-app-role -w @qa-flow-hub/api` against
      # DATABASE_MIGRATION_URL first; the owner URL never reaches this service.
      DATABASE_URL: postgresql://qaflow_app:${APP_DATABASE_PASSWORD:?set APP_DATABASE_PASSWORD in your .env}@postgres:5432/${POSTGRES_DB:-qa_flow_hub}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in your .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in your .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # `NODE_ENV=production` turns `/docs` off by default. This stack is a local
      # demo behind nobody's firewall but your own, so it opts back in; a real
      # deployment should leave the variable unset.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '8080:80'

volumes:
  postgres-data:
